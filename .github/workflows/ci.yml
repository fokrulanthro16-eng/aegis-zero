name: AegisZero Sovereign Edge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Benchmark & AST Interlock Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Benchmark Suite (1,000 iterations)
        run: |
          python tests/benchmark_suite.py

      - name: Verify Benchmark Audit Artifact
        run: |
          test -f benchmark_results.json
          python -c "import json; data=json.load(open('benchmark_results.json')); assert data['engine_resolution_us']['p50'] < 1000, 'Sub-ms retrieval requirement violated!'"
