<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0c111e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
    .title { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .subtitle { font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .badge { font-size: 10px; font-weight: 700; font-family: monospace; }
    .node-title { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .node-metric { font-size: 11px; font-weight: 700; font-family: monospace; }
    .node-desc { font-size: 10px; fill: #94a3b8; }
    .wire { stroke-width: 2; fill: none; stroke-dasharray: 4,4; animation: dash 1s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="680" fill="url(#bgGrad)" rx="16"/>
  <rect width="1098" height="678" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16"/>

  <!-- Top Title Header -->
  <g transform="translate(45, 45)">
    <rect width="32" height="32" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="16" y="22" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#06b6d4">Ω</text>
    <text x="44" y="18" class="sans title">AEGIS<tspan fill="#06b6d4">ZERO</tspan> : LEVEL 3 SOVEREIGN EDGE RUNTIME</text>
    <text x="44" y="32" class="mono subtitle">SPECULATIVE MEMORY KERNEL • WEBGPU ACCELERATION • 3-NODE BYZANTINE FAULT TOLERANCE</text>

    <!-- Top Badges -->
    <rect x="740" y="2" width="130" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="805" y="17" text-anchor="middle" class="badge" fill="#6ee7b7">RETRIEVAL: 11.5 µs</text>

    <rect x="880" y="2" width="130" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="945" y="17" text-anchor="middle" class="badge" fill="#fde68a">ACTION LAG: 0.0 µs</text>
  </g>

  <!-- Flow Stage 1: Ingress Speech Stream -->
  <g transform="translate(45, 120)">
    <rect width="200" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="200" height="6" fill="url(#cyanGrad)" rx="3"/>
    <text x="20" y="32" class="sans node-title">1. WebRTC Ingress</text>
    <text x="20" y="50" class="node-metric" fill="#06b6d4">48kHz Opus Audio</text>
    <text x="20" y="72" class="sans node-desc">• Live Audio Input</text>
    <text x="20" y="90" class="sans node-desc">• Web Audio API Reactivity</text>
    <text x="20" y="108" class="sans node-desc">• 100ms Interim STT Ticks</text>
    
    <!-- Pulse Indicator -->
    <circle cx="170" cy="30" r="4" fill="#06b6d4" filter="url(#glowCyan)"/>
    <rect x="20" y="132" width="160" height="28" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="100" y="150" text-anchor="middle" class="badge" fill="#67e8f9">100ms STREAMING</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 245 210 L 295 210" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Flow Stage 2: Moss WebGPU Memory Kernel -->
  <g transform="translate(300, 120)">
    <rect width="230" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="230" height="6" fill="url(#emeraldGrad)" rx="3"/>
    <text x="20" y="32" class="sans node-title">2. Moss WebGPU Kernel</text>
    <text x="20" y="50" class="node-metric" fill="#10b981">11.5 µs Vectorless Hash</text>
    <text x="20" y="72" class="sans node-desc">• WGSL Compute Shader</text>
    <text x="20" y="90" class="sans node-desc">• In-Process Local RAM</text>
    <text x="20" y="108" class="sans node-desc">• 39,000x Faster Than Cloud</text>
    <circle cx="200" cy="30" r="4" fill="#10b981" filter="url(#glowEmerald)"/>

    <rect x="20" y="132" width="190" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="115" y="150" text-anchor="middle" class="badge" fill="#6ee7b7">PRE-WARMED RAM HIT</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 530 210 L 580 210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <!-- Flow Stage 3: Formal AST Guardrail -->
  <g transform="translate(585, 120)">
    <rect width="230" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="230" height="6" fill="url(#purpleGrad)" rx="3"/>
    <text x="20" y="32" class="sans node-title">3. Formal AST Interlock</text>
    <text x="20" y="50" class="node-metric" fill="#a855f7">28.1 µs AST Validation</text>
    <text x="20" y="72" class="sans node-desc">• Syntax Tree Parsing</text>
    <text x="20" y="90" class="sans node-desc">• Prompt Injection Isolation</text>
    <text x="20" y="108" class="sans node-desc">• Authorized Tool Bounds</text>
    <circle cx="200" cy="30" r="4" fill="#a855f7"/>

    <rect x="20" y="132" width="190" height="28" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="115" y="150" text-anchor="middle" class="badge" fill="#d8b4fe">DETERMINISTIC PERMIT</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <path d="M 815 210 L 865 210" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Flow Stage 4: 3-Node Byzantine Quorum -->
  <g transform="translate(870, 120)">
    <rect width="185" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="185" height="6" fill="url(#amberGrad)" rx="3"/>
    <text x="16" y="32" class="sans node-title">4. Byzantine BFT</text>
    <text x="16" y="50" class="node-metric" fill="#f59e0b">38.0 µs Merkle Root</text>
    <text x="16" y="72" class="sans node-desc">• Node-Alpha (Voice)</text>
    <text x="16" y="90" class="sans node-desc">• Node-Bravo (Sentinel)</text>
    <text x="16" y="108" class="sans node-desc">• Node-Charlie (Arbiter)</text>
    <circle cx="160" cy="30" r="4" fill="#f59e0b" filter="url(#glowAmber)"/>

    <rect x="16" y="132" width="153" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="92" y="150" text-anchor="middle" class="badge" fill="#fde68a">3/3 QUORUM VERIFIED</text>
  </g>

  <!-- Downward Flow to Pre-Armed Dispatch -->
  <path d="M 962 300 L 962 360 L 550 360" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Big Central Container: 0ms Pre-Armed Action Dispatch -->
  <g transform="translate(180, 390)">
    <rect width="740" height="120" rx="14" fill="#091322" stroke="#10b981" stroke-width="2" filter="url(#glowEmerald)"/>
    <rect width="740" height="6" fill="url(#emeraldGrad)" rx="3"/>
    
    <text x="40" y="38" class="sans" font-size="18" font-weight="800" fill="#ffffff">⚡ ZERO-WAIT PRE-ARMED DISPATCH &amp; FULL-DUPLEX BARGE-IN</text>
    <text x="40" y="60" class="mono" font-size="12" fill="#34d399">Effective Action Dispatch Lag: 0.0 µs • Post-VAD RAG Wait: 0.0 ms</text>
    <text x="40" y="85" class="sans" font-size="11" fill="#cbd5e1">Tool payload (e.g. `open_bleed_valve`) is pre-constructed &amp; signed before user finishes sentence.</text>
    <text x="40" y="102" class="sans" font-size="11" fill="#94a3b8">If operator interrupts, Dynamic Full-Duplex Barge-in flushes state within &lt;2.5 ms.</text>

    <!-- Stamp -->
    <rect x="560" y="35" width="150" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="635" y="58" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#a7f3d0">TRUE ZERO</text>
    <text x="635" y="73" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#a7f3d0">LATENCY</text>
  </g>

  <!-- Bottom Timeline / Microsecond Flamegraph Comparison -->
  <g transform="translate(45, 545)">
    <rect width="1010" height="95" rx="10" fill="#090d18" stroke="#1e293b" stroke-width="1"/>
    
    <text x="25" y="25" class="mono" font-size="11" font-weight="700" fill="#94a3b8">MICROSECOND EXECUTION TRACE BREAKDOWN</text>
    <text x="880" y="25" class="mono" font-size="11" font-weight="800" fill="#38bdf8">TOTAL: 76.3 µs</text>

    <!-- Stage Bars -->
    <rect x="25" y="38" width="960" height="8" rx="4" fill="#1e293b"/>
    <!-- Moss Hash Bar: 15% -->
    <rect x="25" y="38" width="160" height="8" rx="4" fill="#06b6d4"/>
    <!-- AST Guardrail: 32% -->
    <rect x="190" y="38" width="310" height="8" rx="4" fill="#a855f7"/>
    <!-- Byzantine Quorum: 48% -->
    <rect x="505" y="38" width="460" height="8" rx="4" fill="#f59e0b"/>
    <!-- Dispatch: 0ms -->
    <rect x="970" y="34" width="15" height="16" rx="2" fill="#10b981" filter="url(#glowEmerald)"/>

    <!-- Legends -->
    <circle cx="30" cy="65" r="4" fill="#06b6d4"/>
    <text x="40" y="69" class="mono" font-size="10" fill="#94a3b8">Moss WebGPU: 11.5 µs</text>

    <circle cx="210" cy="65" r="4" fill="#a855f7"/>
    <text x="220" y="69" class="mono" font-size="10" fill="#94a3b8">AST Policy: 28.1 µs</text>

    <circle cx="410" cy="65" r="4" fill="#f59e0b"/>
    <text x="420" y="69" class="mono" font-size="10" fill="#94a3b8">Byzantine Quorum: 38.0 µs</text>

    <circle cx="630" cy="65" r="4" fill="#10b981"/>
    <text x="640" y="69" class="mono" font-size="10" fill="#94a3b8">Branch Dispatch Lag: 0.0 µs</text>
  </g>
</svg>
